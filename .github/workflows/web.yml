name: Web checks

on:
  push:
    branches: [main, codex/web-two-person]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          package-manager-cache: false
      - run: npm ci
      - run: npm run check:web
      - run: node scripts/package-web.mjs
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Verify and exercise packaged Web build
        run: |
          (cd artifacts/web-release && sha256sum --check -- *.sha256)
          web_package=$(find artifacts/web-release -name '*.zip' -type f -print -quit)
          US_WEB_TEST_PACKAGE="$web_package" npx playwright test
